<!DOCTYPE html>
<html lang="en-GB">
<head>
    <meta charset="UTF-8">

    <title>KNOK Matrix / Mono</title>
    <meta name="description" content="KNOK Matrix / Mono: ten digits built from pure geometric SVG, shown as a design index and a live clock. One HTML file, no dependencies. By Shaz Moghaddam, London.">
    <meta name="author" content="Shaz Moghaddam">
    <meta name="color-scheme" content="light dark">
    <meta name="theme-color" content="#f6f5f0" media="(prefers-color-scheme: light)">
    <meta name="theme-color" content="#0b0c10" media="(prefers-color-scheme: dark)">

    <meta property="og:type" content="website">
    <meta property="og:title" content="KNOK Matrix / Mono">
    <meta property="og:description" content="Ten digits built from pure geometric SVG, shown as a design index and a live clock.">
    <meta property="og:url" content="https://shazmoghaddam.github.io/knok-matrix/">
    <meta property="og:image" content="https://shazmoghaddam.github.io/knok-matrix/assets/social-preview.png">

    <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Crect width='100' height='100' rx='22' fill='%23f6f5f0'/%3E%3Ccircle cx='50' cy='50' r='32' fill='%23FFCC00'/%3E%3Ccircle cx='50' cy='50' r='14' fill='%23f6f5f0'/%3E%3Crect x='18' y='30' width='13' height='40' fill='%232845D6'/%3E%3C/svg%3E">

    <script>
        /* Apply the saved or system theme before first paint, so there is no flash */
        (function () {
            var saved = null;
            try { saved = localStorage.getItem('knok-theme'); } catch (e) {}
            var dark = saved ? saved === 'dark'
                             : window.matchMedia('(prefers-color-scheme: dark)').matches;
            if (dark) document.documentElement.setAttribute('data-theme', 'dark');
        })();
    </script>

    <style>
        /* ==========================================
           PALETTE
           ========================================== */
        :root {
            --bg-canvas: #f6f5f0;
            --surface: #fbfaf7;          /* cards: solid, so knockouts match exactly */
            --surface-sunk: #f1efe8;     /* clock digit boxes */
            --color-text: #1a1a1a;
            --text-muted: #5c5b57;
            --border: rgba(0, 0, 0, 0.09);
            --focus: #2845D6;

            /* The 11 named colours */
            --color-mint: #2FA084;
            --color-ultramarine: #3852B4;
            --color-deepgreen: #285A48;
            --color-royalfall: #2845D6;
            --color-amethyst: #B153D7;
            --color-purered: #FF0000;
            --color-cornflower: #5A7ACD;
            --color-vibrantyellow: #FFCC00;
            --color-slate: #7F8CAA;
            --color-safetyorange: #FF6500;
            --color-hotpink: #FF4B91;

            /* Slot colours used by the glyphs */
            --c1: var(--color-royalfall);
            --c2: var(--color-safetyorange);
            --c3: var(--color-mint);
            --c4: var(--color-vibrantyellow);
            --c5: var(--color-amethyst);
            --c6: var(--color-hotpink);
            --c7: var(--color-deepgreen);

            --blend-mode: multiply;
            --knockout: var(--bg-canvas);
        }

        /* Scoped to <html> so the theme buttons never pick these up */
        html[data-theme="dark"] {
            --bg-canvas: #0b0c10;
            --surface: #13141a;
            --surface-sunk: #0f1015;
            --color-text: #f4f4f5;
            --text-muted: #a3a3ad;
            --border: rgba(255, 255, 255, 0.1);
            --focus: #FFCC00;

            --c1: var(--color-hotpink);
            --c2: var(--color-vibrantyellow);
            --c3: var(--color-mint);
            --c4: var(--color-royalfall);
            --c5: var(--color-amethyst);
            --c6: var(--color-safetyorange);
            --c7: var(--color-cornflower);

            --blend-mode: screen;
        }

        /* ==========================================
           LAYOUT
           ========================================== */
        *, *::before, *::after { box-sizing: border-box; }

        body {
            background-color: var(--bg-canvas);
            color: var(--color-text);
            margin: 0;
            padding: clamp(24px, 5vw, 48px) clamp(16px, 4vw, 32px) 24px;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Arial, sans-serif;
            transition: background-color 0.4s ease, color 0.4s ease;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
        }

        .container {
            max-width: 1300px;
            margin: 0 auto;
            flex: 1;
            width: 100%;
        }

        header {
            text-align: center;
            margin-bottom: clamp(24px, 4vw, 40px);
        }

        header h1 {
            font-size: clamp(1.9rem, 6vw, 2.6rem);
            line-height: 1.05;
            font-weight: 900;
            text-transform: uppercase;
            letter-spacing: -0.5px;
            margin: 0 0 10px;
        }

        header p {
            font-size: clamp(0.78rem, 2.4vw, 0.95rem);
            color: var(--text-muted);
            margin: 0;
            letter-spacing: 1px;
            text-transform: uppercase;
        }

        /* Segmented controls: theme + clock format */
        .controls {
            display: flex;
            justify-content: center;
            flex-wrap: wrap;
            gap: 12px;
            margin-bottom: clamp(28px, 5vw, 50px);
        }

        .segmented {
            display: inline-flex;
            padding: 4px;
            gap: 4px;
            border-radius: 999px;
            background: var(--surface);
            border: 1px solid var(--border);
        }

        .btn {
            background: transparent;
            border: 0;
            color: var(--color-text);
            padding: 9px 18px;
            min-height: 36px;
            border-radius: 999px;
            cursor: pointer;
            font: inherit;
            font-weight: 600;
            font-size: 0.85rem;
            transition: background-color 0.2s ease, color 0.2s ease;
        }

        .btn:hover { background: var(--border); }

        .btn[aria-pressed="true"] {
            background: var(--color-text);
            color: var(--bg-canvas);
        }

        :focus-visible {
            outline: 2px solid var(--focus);
            outline-offset: 3px;
        }

        /* ==========================================
           LIVE CLOCK
           ========================================== */
        .clock-section {
            background: var(--surface);
            border: 1px solid var(--border);
            border-radius: 16px;
            padding: clamp(20px, 4vw, 35px) clamp(12px, 3vw, 20px);
            margin-bottom: clamp(36px, 6vw, 60px);
            box-shadow: 0 20px 40px rgba(0, 0, 0, 0.03);
        }

        .clock-title {
            text-align: center;
            font-size: 0.75rem;
            text-transform: uppercase;
            letter-spacing: 3px;
            margin: 0 0 clamp(16px, 3vw, 25px);
            font-weight: 700;
            color: var(--text-muted);
        }

        .clock-display {
            display: flex;
            justify-content: center;
            align-items: center;
            gap: clamp(4px, 1.4vw, 16px);
            max-width: 820px;
            margin: 0 auto;
        }

        .clock-digit-box {
            --knockout: var(--surface-sunk);
            flex: 1 1 0;
            min-width: 0;
            max-width: 100px;
            aspect-ratio: 5 / 7;
            background: var(--surface-sunk);
            border-radius: 8px;
            transition: background-color 0.4s ease;
        }

        /* 12-hour mode: an hour below 10 shows one digit, like a real clock face */
        .clock-digit-box.is-blank .art-digit { visibility: hidden; }

        .clock-separator {
            display: flex;
            flex-direction: column;
            justify-content: center;
            gap: clamp(8px, 2vw, 16px);
            flex: 0 0 auto;
        }

        .clock-dot {
            width: clamp(6px, 1.4vw, 12px);
            height: clamp(6px, 1.4vw, 12px);
            background-color: var(--color-purered);
            border-radius: 50%;
            animation: pulse 1s infinite alternate;
        }

        .clock-meridiem {
            flex: 0 0 auto;
            align-self: flex-end;
            font-size: clamp(0.7rem, 2vw, 0.95rem);
            font-weight: 800;
            letter-spacing: 1px;
            color: var(--text-muted);
            padding-bottom: 4px;
        }
        .clock-meridiem[hidden] { display: none; }

        @keyframes pulse {
            from { opacity: 0.2; }
            to   { opacity: 1; }
        }

        /* ==========================================
           DESIGN INDEX
           ========================================== */
        .section-title {
            font-size: clamp(0.95rem, 2.6vw, 1.1rem);
            text-transform: uppercase;
            letter-spacing: 2px;
            margin: 0 0 clamp(18px, 3vw, 30px);
            border-bottom: 2px solid var(--border);
            padding-bottom: 12px;
            font-weight: 700;
        }

        .digits-grid {
            display: grid;
            grid-template-columns: repeat(5, 1fr);
            gap: clamp(12px, 2vw, 24px);
            margin: 0;
            padding: 0;
            list-style: none;
        }

        @media (max-width: 950px) {
            .digits-grid { grid-template-columns: repeat(3, 1fr); }
        }
        @media (max-width: 600px) {
            .digits-grid { grid-template-columns: repeat(2, 1fr); }
        }

        .digit-card {
            --knockout: var(--surface);
            background: var(--surface);
            border: 1px solid var(--border);
            border-radius: 14px;
            padding: clamp(14px, 3vw, 20px);
            display: flex;
            flex-direction: column;
            align-items: center;
            transition: transform 0.3s cubic-bezier(0.16, 1, 0.3, 1), background-color 0.4s ease;
        }

        .digit-card:hover { transform: translateY(-4px); }

        .art-digit-wrapper {
            width: 100%;
            max-width: 160px;
            aspect-ratio: 5 / 7;
            display: block;
        }

        .digit-label {
            margin-top: 12px;
            font-weight: 700;
            font-size: 0.8rem;
            letter-spacing: 1px;
            color: var(--text-muted);
            font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
        }

        /* ==========================================
           FOOTER
           ========================================== */
        footer {
            margin-top: 60px;
            padding-top: 20px;
            border-top: 1px solid var(--border);
            display: flex;
            justify-content: space-between;
            align-items: center;
            font-size: 0.75rem;
            letter-spacing: 1.5px;
            text-transform: uppercase;
            font-weight: 600;
            flex-wrap: wrap;
            gap: 12px 24px;
            color: var(--text-muted);
        }

        footer nav { display: flex; gap: 18px; flex-wrap: wrap; }

        footer a {
            color: var(--color-text);
            text-decoration: none;
            border-bottom: 1px solid transparent;
            transition: border-color 0.2s ease;
        }

        footer a:hover { border-bottom-color: var(--color-text); }

        @media (max-width: 600px) {
            footer { flex-direction: column; align-items: flex-start; }
        }

        /* ==========================================
           SVG ARTWORK (500 x 700 viewBox)
           ========================================== */
        .art-digit {
            width: 100%;
            height: 100%;
            display: block;
            overflow: visible;          /* sharp mitres (like the 4) can reach past the box */
        }

        .art-digit path,
        .art-digit rect,
        .art-digit circle,
        .art-digit polygon {
            mix-blend-mode: var(--blend-mode);
            opacity: 0.95;
            transition: fill 0.3s ease;
        }

        /* Knockouts take the colour of whatever surface they sit on */
        .art-digit .knockout {
            mix-blend-mode: normal !important;
            opacity: 1 !important;
            fill: var(--knockout) !important;
            transition: fill 0.4s ease;
        }

        .sr-only {
            position: absolute;
            width: 1px;
            height: 1px;
            padding: 0;
            margin: -1px;
            overflow: hidden;
            clip: rect(0, 0, 0, 0);
            white-space: nowrap;
            border: 0;
        }

        @media (prefers-reduced-motion: reduce) {
            .clock-dot { animation: none; opacity: 0.7; }
            .digit-card, .digit-card:hover { transition: none; transform: none; }
            body, .btn { transition: none; }
        }
    </style>
</head>

<script>
    'use strict';

    const svgTemplates = Array.from(
        document.getElementById('digit-templates').content.querySelectorAll('.art-digit')
    );

    const SLOTS = ['h1', 'h2', 'm1', 'm2', 's1', 's2'];
    const shown = {};             // last value drawn in each slot, so we only touch the DOM on change
    let tickTimer = null;
    let lastSpokenMinute = '';
    let hourFormat = '24';

    /* ── Storage (can throw in private windows, so always guarded) ── */
    function load(key) {
        try { return localStorage.getItem(key); } catch (e) { return null; }
    }
    function save(key, value) {
        try { localStorage.setItem(key, value); } catch (e) { /* not essential */ }
    }

    /* ── Clock ─────────────────────────────────────────────────── */
    function drawSlot(slotId, value) {
        if (shown[slotId] === value) return;
        shown[slotId] = value;
        const box = document.getElementById(slotId);
        const blank = value === ' ';
        box.classList.toggle('is-blank', blank);
        // A blank slot keeps a hidden "0" so the layout never shifts
        box.replaceChildren(svgTemplates[blank ? 0 : Number(value)].cloneNode(true));
    }

    function updateClock() {
        const now = new Date();
        let hours = now.getHours();
        let meridiem = '';

        if (hourFormat === '12') {
            meridiem = hours < 12 ? 'AM' : 'PM';
            hours = hours % 12 || 12;
        }

        const h = hourFormat === '12'
            ? String(hours).padStart(2, ' ')
            : String(hours).padStart(2, '0');
        const m = String(now.getMinutes()).padStart(2, '0');
        const s = String(now.getSeconds()).padStart(2, '0');

        drawSlot('h1', h[0]); drawSlot('h2', h[1]);
        drawSlot('m1', m[0]); drawSlot('m2', m[1]);
        drawSlot('s1', s[0]); drawSlot('s2', s[1]);

        const mer = document.getElementById('meridiem');
        mer.hidden = !meridiem;
        mer.textContent = meridiem;

        // Screen-reader text changes once a minute, not every second
        const spoken = `${h.trim()}:${m}${meridiem ? ' ' + meridiem : ''}`;
        if (spoken !== lastSpokenMinute) {
            lastSpokenMinute = spoken;
            const t = document.getElementById('clock-accessible');
            t.textContent = `Current time ${spoken}`;
            t.dateTime = `${String(now.getHours()).padStart(2, '0')}:${m}`;
        }
    }

    // Tick on the real second boundary, so the display never lags the system clock
    function scheduleTick() {
        clearTimeout(tickTimer);
        tickTimer = setTimeout(() => {
            updateClock();
            scheduleTick();
        }, 1000 - (Date.now() % 1000) + 5);
    }

    function stopTick() {
        clearTimeout(tickTimer);
        tickTimer = null;
    }

    /* ── Toggles ───────────────────────────────────────────────── */
    function pressOnly(selector, attr, value) {
        document.querySelectorAll(selector).forEach(btn => {
            btn.setAttribute('aria-pressed', String(btn.getAttribute(attr) === value));
        });
    }

    function setTheme(theme, remember) {
        if (theme === 'dark') {
            document.documentElement.setAttribute('data-theme', 'dark');
        } else {
            document.documentElement.removeAttribute('data-theme');
        }
        pressOnly('[data-theme-choice]', 'data-theme-choice', theme);
        if (remember) save('knok-theme', theme);
    }

    function setFormat(format, remember) {
        hourFormat = format === '12' ? '12' : '24';
        pressOnly('[data-format-choice]', 'data-format-choice', hourFormat);
        if (remember) save('knok-format', hourFormat);
        updateClock();
    }

    /* ── Boot ──────────────────────────────────────────────────── */
    function init() {
        document.querySelectorAll('.art-digit-wrapper').forEach(wrapper => {
            wrapper.appendChild(svgTemplates[Number(wrapper.dataset.digit)].cloneNode(true));
        });

        document.querySelectorAll('[data-theme-choice]').forEach(btn => {
            btn.addEventListener('click', () => setTheme(btn.dataset.themeChoice, true));
        });
        document.querySelectorAll('[data-format-choice]').forEach(btn => {
            btn.addEventListener('click', () => setFormat(btn.dataset.formatChoice, true));
        });

        // Sync buttons with the theme the head script already applied
        setTheme(document.documentElement.getAttribute('data-theme') === 'dark' ? 'dark' : 'light', false);

        // Follow the system theme live, unless the visitor picked one
        window.matchMedia('(prefers-color-scheme: dark)').addEventListener('change', e => {
            if (!load('knok-theme')) setTheme(e.matches ? 'dark' : 'light', false);
        });

        setFormat(load('knok-format') || '24', false);
        scheduleTick();
    }

    // Pause while the tab is hidden; resync the moment it comes back
    document.addEventListener('visibilitychange', () => {
        if (document.hidden) {
            stopTick();
        } else {
            updateClock();
            scheduleTick();
        }
    });

    document.addEventListener('DOMContentLoaded', init);
</script>

</body>
</html>
